name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  daml:
    name: Daml (build + tests + upgrade compatibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache DPM and the pinned SDK
        uses: actions/cache@v4
        with:
          path: ~/.dpm
          key: dpm-${{ runner.os }}-${{ hashFiles('trading/daml.yaml') }}
          restore-keys: dpm-${{ runner.os }}-
      - name: Install DPM
        run: |
          curl -sSL https://get.digitalasset.com/install/install.sh | sh
          echo "$HOME/.dpm/bin" >> "$GITHUB_PATH"
      - name: Install the SDK pinned by trading/daml.yaml
        run: dpm install "$(awk '/^sdk-version:/ {print $2; exit}' trading/daml.yaml)"
      - name: Build and test
        run: bash scripts/run-local-daml-tests.sh
      - name: Upgrade compatibility with the deployed version
        run: bash scripts/check-upgrade-compat.sh

  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/operator-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/operator-backend/package-lock.json
      - name: Install registry-client deps
        run: npm ci
        working-directory: services/registry-client
      - name: Install backend deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Typecheck live driver sources (no Canton connection)
        run: npm run typecheck:live-scripts
      - name: Test
        run: npm test

  frontend:
    name: Frontend (typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify production bundle excludes development authority adapters
        run: |
          if grep -R -E '/v1/wallet/(submit|execute)|VITE_CANTON_AUTH_TOKEN|Direct Canton|Operator Relay' dist; then
            echo "development-only wallet authority leaked into the production bundle" >&2
            exit 1
          fi

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build

  docker:
    name: Container build + backend runtime smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: |
          if [ -f Dockerfile.backend ]; then
            docker build -f Dockerfile.backend -t canton-dex-backend:ci .
          else
            echo "Dockerfile.backend not present on this branch; skipping"
          fi
      - name: Runtime-smoke backend image
        run: |
          cid="$(docker run --rm -d -p 127.0.0.1:18082:8080 \
            -e DEX_READ_ONLY=1 \
            -e CANTON_LEDGER_URL=http://127.0.0.1:1 \
            -e CANTON_LEDGER_TOKEN=ci-ledger-token \
            -e CANTON_OPERATOR=Operator::ci \
            -e CANTON_LP_REGISTRAR=LpRegistrar::ci \
            -e CANTON_ADMIN=Admin::ci \
            -e 'CANTON_DEX_PACKAGE_ID=#canton-dex-trading-v2' \
            canton-dex-backend:ci)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18082/v1/status > /tmp/dex-status.json; then
              break
            fi
            sleep 1
          done
          grep -q '"synced":false' /tmp/dex-status.json
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{}' \
            http://127.0.0.1:18082/v1/admin/pairs)" = 401
          docker exec "$cid" node -e \
            'if (process.getuid?.() === 0) throw new Error("backend runs as root"); const Database=require("better-sqlite3"); const db=new Database(":memory:"); db.exec("select 1"); db.close()'
      - name: Build frontend image
        run: |
          if [ -f Dockerfile.frontend ]; then
            docker build -f Dockerfile.frontend -t canton-dex-frontend:ci .
          else
            echo "Dockerfile.frontend not present on this branch; skipping"
          fi
